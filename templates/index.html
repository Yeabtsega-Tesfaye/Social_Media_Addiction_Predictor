<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Addiction Predictor</title>
    <!-- Font Awesome 6 for modern icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Animated background blobs */
        .bg-blobs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: float 12s infinite ease-in-out;
        }

        .blob1 {
            width: 400px;
            height: 400px;
            background: #ff6b6b;
            top: 10%;
            left: 5%;
            animation-delay: 0s;
        }

        .blob2 {
            width: 350px;
            height: 350px;
            background: #4ecdc4;
            bottom: 10%;
            right: 5%;
            animation-delay: -4s;
        }

        .blob3 {
            width: 300px;
            height: 300px;
            background: #a55eea;
            top: 50%;
            left: 60%;
            animation-delay: -8s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        .main-card {
            width: 100%;
            max-width: 750px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            padding: 40px;
            color: white;
            transition: transform 0.3s ease;
        }

        .main-card:hover {
            transform: translateY(-5px);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-label {
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-label i {
            width: 20px;
            color: #a5b4fc;
        }

        input, select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 12px 15px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: #a5b4fc;
            box-shadow: 0 0 15px rgba(165, 180, 252, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        option {
            background: #2d2b55;
            color: white;
        }

        /* Remove default number input spinners */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        .btn-predict {
            grid-column: span 2;
            background: linear-gradient(135deg, #a5b4fc, #c084fc);
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            letter-spacing: 0.5px;
        }

        .btn-predict:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 25px rgba(165, 180, 252, 0.4);
        }

        .btn-predict:active {
            transform: scale(0.98);
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ======================================== */
        /* MODAL OVERLAY */
        /* ======================================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-dialog {
            background: rgba(20, 20, 50, 0.9);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 35px 30px 30px;
            max-width: 500px;
            width: 90%;
            color: white;
            position: relative;
            transform: scale(0.85) translateY(20px);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-overlay.active .modal-dialog {
            transform: scale(1) translateY(0);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 1.2rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* ======================================== */
        /* RESULT INSIDE MODAL */
        /* ======================================== */
        .result-card {
            text-align: center;
            position: relative;
            overflow: hidden;
            border-radius: 16px;
        }

        /* Shimmer wave */
        .result-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
            animation: shimmer 0.8s ease;
            pointer-events: none;
            z-index: 2;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .prediction-badge {
            display: inline-block;
            padding: 10px 28px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1.4rem;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
            border-right: 3px solid rgba(255,255,255,0.7);
            animation: typing-reveal 0.6s steps(6, end) forwards, blink-caret 0.75s step-end 3;
            width: 0;
        }

        @keyframes typing-reveal {
            from { width: 0; }
            to { width: auto; min-width: 100px; }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: white; }
        }

        /* Pulse ring after typing done */
        .prediction-badge.pulse-ready::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 100%; height: 100%;
            border-radius: 30px;
            transform: translate(-50%, -50%);
            animation: pulse-ring 1.2s ease-out;
            z-index: -1;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.5); }
            100% { box-shadow: 0 0 0 20px rgba(255,255,255,0); }
        }

        .level-low { background: #10b981; }
        .level-medium { background: #f59e0b; color: #1e1b4b; }
        .level-high { background: #ef4444; }

        .prob-item {
            margin-bottom: 18px;
            text-align: left;
        }

        .prob-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .prob-bar-bg {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
        }

        .prob-bar-fill {
            height: 100%;
            border-radius: 10px;
            width: 0%;
            animation: bar-bounce 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            animation-delay: 0.4s;
        }

        @keyframes bar-bounce {
            from { width: 0%; }
        }

        .fill-low { background: linear-gradient(90deg, #10b981, #34d399); }
        .fill-medium { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
        .fill-high { background: linear-gradient(90deg, #ef4444, #f87171); }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .btn-predict {
                grid-column: span 1;
            }
            .modal-dialog {
                padding: 25px 20px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Animated blobs -->
    <div class="bg-blobs">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>
    </div>

    <!-- ===== MAIN FORM CARD ===== -->
    <div class="main-card">
        <h1>📱 Social Media Addiction Predictor</h1>
        <p class="subtitle">Powered by machine learning — enter your habits and get an instant prediction</p>

        <form id="prediction-form">
            <div class="form-grid">
                <!-- Age -->
                <div class="input-group">
                    <label class="input-label"><i class="fas fa-user"></i> Age</label>
                    <input type="number" name="Age" placeholder="20" required min="10" max="100">
                </div>

                <!-- Gender -->
                <div class="input-group">
                    <label class="input-label"><i class="fas fa-venus-mars"></i> Gender</label>
                    <select name="Gender">
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>

                <!-- Academic Level -->
                <div class="input-group">
                    <label class="input-label"><i class="fas fa-graduation-cap"></i> Academic Level</label>
                    <select name="Academic_Level">
                        <option>High School</option>
                        <option>Undergraduate</option>
                        <option>Graduate</option>
                    </select>
                </div>

                <!-- Country -->
                <div class="input-group">
                    <label class="input-label"><i class="fas fa-globe"></i> Country</label>
                    <input type="text" name="Country" placeholder="e.g., Ethiopia" required>
                </div>

                <!-- Avg Daily Usage Hours -->
                <div class="input-group">
                    <label class="input-label"><i class="fas fa-clock"></i> Avg Daily Usage (hrs)</label>
                    <input type="number" name="Avg_Daily_Usage_Hours" step="0.1" placeholder="5.5" required min="0" max="24">
                </div>

                <!-- Most Used Platform -->
                <div class="input-group">
                    <label class="input-label"><i class="fab fa-instagram"></i> Most Used Platform</label>
                    <select name="Most_Used_Platform">
                        <option>Instagram</option>
                        <option>TikTok</option>
                        <option>Facebook</option>
                        <option>Twitter</option>
                        <option>Snapchat</option>
                        <option>LINE</option>
                        <option>LinkedIn</option>
                        <option>Others</option>
                    </select>
                </div>

                <!-- Affects Academic Performance -->
                <div class="input-group">
                    <label class="input-label"><i class="fas fa-book"></i> Affects Academic Perf?</label>
                    <select name="Affects_Academic_Performance">
                        <option>Yes</option>
                        <option>No</option>
                    </select>
                </div>

                <!-- Sleep Hours -->
                <div class="input-group">
                    <label class="input-label"><i class="fas fa-bed"></i> Sleep Hours / Night</label>
                    <input type="number" name="Sleep_Hours_Per_Night" step="0.1" placeholder="7.0" required min="0" max="24">
                </div>

                <!-- Mental Health Score -->
                <div class="input-group">
                    <label class="input-label"><i class="fas fa-brain"></i> Mental Health Score (0–100)</label>
                    <input type="number" name="Mental_Health_Score" step="0.1" placeholder="65" required min="0" max="100">
                </div>

                <!-- Relationship Status -->
                <div class="input-group">
                    <label class="input-label"><i class="fas fa-heart"></i> Relationship Status</label>
                    <select name="Relationship_Status">
                        <option>Single</option>
                        <option>In a relationship</option>
                        <option>It's complicated</option>
                    </select>
                </div>

                <!-- Submit button -->
                <button type="submit" class="btn-predict">
                    <i class="fas fa-magic"></i> Predict My Addiction Level
                </button>
            </div>
        </form>
    </div>

    <!-- ===== PREDICTION MODAL ===== -->
    <div id="prediction-modal" class="modal-overlay">
        <div class="modal-dialog">
            <button class="modal-close" id="modal-close-btn">&times;</button>
            <div class="result-card">
                <div style="text-align: center;">
                    <span id="prediction-label" class="prediction-badge"></span>
                </div>
                <div class="prob-item">
                    <div class="prob-label">
                        <span><i class="fas fa-circle" style="color:#10b981;"></i> Low</span>
                        <span id="prob-low-text">0%</span>
                    </div>
                    <div class="prob-bar-bg">
                        <div id="prob-low" class="prob-bar-fill fill-low" style="width: 0%;"></div>
                    </div>
                </div>
                <div class="prob-item">
                    <div class="prob-label">
                        <span><i class="fas fa-circle" style="color:#f59e0b;"></i> Medium</span>
                        <span id="prob-medium-text">0%</span>
                    </div>
                    <div class="prob-bar-bg">
                        <div id="prob-medium" class="prob-bar-fill fill-medium" style="width: 0%;"></div>
                    </div>
                </div>
                <div class="prob-item">
                    <div class="prob-label">
                        <span><i class="fas fa-circle" style="color:#ef4444;"></i> High</span>
                        <span id="prob-high-text">0%</span>
                    </div>
                    <div class="prob-bar-bg">
                        <div id="prob-high" class="prob-bar-fill fill-high" style="width: 0%;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('prediction-form');
        const modal = document.getElementById('prediction-modal');
        const closeBtn = document.getElementById('modal-close-btn');
        const label = document.getElementById('prediction-label');

        // --- Helper: show modal ---
        function openModal() {
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';     // prevent background scroll
        }

        // --- Helper: hide modal ---
        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
            // Reset badge & bars for next prediction
            label.className = 'prediction-badge';
            label.textContent = '';
            label.classList.remove('pulse-ready');
            ['prob-low','prob-medium','prob-high'].forEach(id => {
                document.getElementById(id).style.width = '0%';
            });
            ['prob-low-text','prob-medium-text','prob-high-text'].forEach(id => {
                document.getElementById(id).textContent = '0%';
            });
        }

        // Close modal: X button
        closeBtn.addEventListener('click', closeModal);

        // Close modal: click outside dialog
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // Close modal: Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                closeModal();
            }
        });

        // --- Form submit ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            // Loading state
            const btn = form.querySelector('.btn-predict');
            btn.innerHTML = '<span class="spinner"></span> Analyzing...';
            btn.disabled = true;

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                // Update badge
                label.textContent = result.prediction;
                label.className = 'prediction-badge';

                if (result.prediction === 'Low') label.classList.add('level-low');
                else if (result.prediction === 'Medium') label.classList.add('level-medium');
                else label.classList.add('level-high');

                // After typing animation finishes (0.6s), add pulse ring
                setTimeout(() => {
                    label.classList.add('pulse-ready');
                }, 700);

                // Update bars (with slight delay so bounce anim is visible)
                const updateBar = (id, textId, value) => {
                    const pct = (value * 100).toFixed(1);
                    const bar = document.getElementById(id);
                    bar.style.width = pct + '%';
                    // Force re-trigger animation
                    bar.style.animation = 'none';
                    bar.offsetHeight; // trigger reflow
                    bar.style.animation = 'bar-bounce 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';
                    bar.style.animationDelay = '0.3s';
                    document.getElementById(textId).textContent = pct + '%';
                };

                setTimeout(() => {
                    updateBar('prob-low', 'prob-low-text', result.probabilities.Low);
                    updateBar('prob-medium', 'prob-medium-text', result.probabilities.Medium);
                    updateBar('prob-high', 'prob-high-text', result.probabilities.High);
                }, 100);

                // Open the modal
                openModal();

            } catch (error) {
                alert('Oops! Something went wrong. Please try again.');
            } finally {
                btn.innerHTML = '<i class="fas fa-magic"></i> Predict My Addiction Level';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
