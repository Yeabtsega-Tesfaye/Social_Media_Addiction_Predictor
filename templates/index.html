<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Addiction Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Predict Social Media Addiction Level</h1>
        <form method="POST">
            <label>Age:</label>
            <input type="number" name="age" required min="10" max="100">

            <label>Gender:</label>
            <select name="gender">
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

            <label>Academic Level:</label>
            <select name="academic_level">
                <option>High School</option>
                <option>Undergraduate</option>
                <option>Graduate</option>
            </select>

            <label>Country:</label>
            <input type="text" name="country" required placeholder="e.g., Japan, USA">

            <label>Average Daily Usage (hours):</label>
            <input type="number" name="usage_hours" step="0.1" required min="0" max="24">

            <label>Most Used Platform:</label>
            <select name="platform">
                <option>Instagram</option>
                <option>TikTok</option>
                <option>Facebook</option>
                <option>Twitter</option>
                <option>Snapchat</option>
                <option>LINE</option>
                <option>LinkedIn</option>
                <option>Others</option>
            </select>

            <label>Affects Academic Performance?</label>
            <select name="affects_academic">
                <option>Yes</option>
                <option>No</option>
            </select>

            <label>Sleep Hours per Night:</label>
            <input type="number" name="sleep_hours" step="0.1" required min="0" max="24">

            <label>Mental Health Score (0‑100):</label>
            <input type="number" name="mental_health" step="0.1" required min="0" max="100">

            <label>Relationship Status:</label>
            <select name="relationship">
                <option>Single</option>
                <option>In a relationship</option>
                <option>It's complicated</option>
            </select>

            <button type="submit">Predict</button>
        </form>

        {% if prediction %}
            <div class="result">
                <h2>Predicted Addiction Level: <strong>{{ prediction }}</strong></h2>
            </div>
        {% endif %}
    </div>
</body>
</html>
